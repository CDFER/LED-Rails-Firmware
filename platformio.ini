; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = platformio/espressif32 @ ^6.12.0
board_build.partitions  = boards/default_4MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = 
    -DFIRMWARE=\"LED-Rails\"
    -DFIRMWARE_VERSION=\"1.3.0.alpha\"
    -DCORE_DEBUG_LEVEL=3
	-DCONFIG_ARDUHAL_LOG_COLORS=true
lib_deps = 
	cdfer/ltr303-light @ 1.1.0
    fastled/FastLED @ 3.10.3
    bblanchon/ArduinoJson @ 7.4.2
    esp32async/ESPAsyncWebServer @ 3.8.1
    jnthas/Improv WiFi Library @ 0.0.3
    ;symlink://C:\Users\Taranaki\Documents\Github\Micro-Projects\Libraries\Improv-WiFi-Library
extra_scripts = merge-bin.py

[WebInstall]
extends = env
build_type = release
build_flags =
    ${env.build_flags}

[Factory]
extends = env
build_type = release
build_flags =
    ${env.build_flags}
    -DFACTORY_TEST=1

[Beta]
extends = env
build_type = debug
build_flags =
    ${env.build_flags}

[env:AKL_V1_0_0]
board = AKL_V1_0_0
extends = WebInstall

[env:AKL_V1_1_0]
board = AKL_V1_1_0
extends = WebInstall

[env:WLG_V1_0_0]
board = WLG_V1_0_0
extends = WebInstall

[env:AKL_V1_1_0_Factory]
board = AKL_V1_1_0
extends = Factory

[env:WLG_V1_0_0_Factory]
board = WLG_V1_0_0
extends = Factory

[env:MEL_V1_0_0_Factory]
board = MEL_V1_0_0
extends = Factory

[env:MEL_V1_0_0_Beta]
board = MEL_V1_0_0
extends = Beta