; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = platformio/espressif32 @ 7.0.1
board_build.partitions = boards/default_4MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = 
	-std=gnu++11
build_flags = 
	-DFIRMWARE=\"LED-Rails\"
	-DFIRMWARE_VERSION=\"1.4.0\"
	-DCONFIG_ARDUHAL_LOG_COLORS=true
	-std=gnu++17
lib_deps = 
	cdfer/ltr303-light @ 1.1.0
	bblanchon/ArduinoJson @ 7.4.3
	esp32async/ESPAsyncWebServer @ 3.12.0
	https://github.com/CDFER/Improv-WiFi-Library.git
extra_scripts = 
	pre:tools/build_device_web.py
	tools/merge-bin.py

[esp32-C3]
lib_deps = 
	${env.lib_deps}
	fastled/FastLED @ 3.10.3

[esp32-S3]
lib_deps = 
	${env.lib_deps}
	fastled/FastLED @ 3.7.0

[WebInstall]
extends = env
build_type = release
build_flags = 
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=2

[Factory]
extends = env
build_type = release
build_flags = 
	${env.build_flags}
	-DFACTORY_TEST=1
	-DCORE_DEBUG_LEVEL=2

[Beta]
extends = env
build_type = debug
build_flags = 
	${env.build_flags}
	-DBETA_BUILD=1
	-DCORE_DEBUG_LEVEL=3

[env:AKL_V1_0_0]
board = AKL_V1_0_0
extends = WebInstall, esp32-C3

[env:AKL_V1_1_0]
board = AKL_V1_1_0
extends = WebInstall, esp32-C3

[env:WLG_V1_0_0]
board = WLG_V1_0_0
extends = WebInstall, esp32-C3

[env:MEL_V1_0_0]
board = MEL_V1_0_0
extends = WebInstall, esp32-S3

[env:AKL_V1_1_0_Factory]
board = AKL_V1_1_0
extends = Factory, esp32-C3

[env:WLG_V1_0_0_Factory]
board = WLG_V1_0_0
extends = Factory, esp32-C3

[env:MEL_V1_0_0_Factory]
board = MEL_V1_0_0
extends = Factory, esp32-S3

[env:AKL_V1_1_0_Beta]
board = AKL_V1_1_0
extends = Beta, esp32-C3

[env:WLG_V1_0_0_Beta]
board = WLG_V1_0_0
extends = Beta, esp32-C3

[env:MEL_V1_0_0_Beta]
board = MEL_V1_0_0
extends = Beta, esp32-S3
