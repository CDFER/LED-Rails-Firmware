; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = platformio/espressif32@^6.12.0
board_build.partitions  = boards/default_4MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug
;board_build.f_cpu = 80000000L ; 80 MHz clock speed
build_flags = 
    -DFIRMWARE=\"LED-Rails\"
    -DFIRMWARE_VERSION=\"1.2.2\"
    -DCORE_DEBUG_LEVEL=3
	-DCONFIG_ARDUHAL_LOG_COLORS=true
lib_deps = 
	cdfer/ltr303-light @ ^1.1.0
    fastled/FastLED @ ^3.10.3
    bblanchon/ArduinoJson @ ^7.4.2
    esp32async/ESPAsyncWebServer@^3.8.1
    jnthas/Improv WiFi Library @ ^0.0.3
    ;https://github.com/CDFER/Improv-WiFi-Library.git
    ;symlink://C:\Users\Taranaki\Documents\Github\Micro-Projects\Libraries\Improv-WiFi-Library
extra_scripts = merge-bin.py

[env:AKL_V1_0_0]
board = AKL_V1_0_0
build_flags =
    ${env.build_flags}

[env:AKL_V1_1_0]
board = AKL_V1_1_0
build_flags =
    ${env.build_flags}

[env:AKL_V1_1_0_Factory_Test]
board = AKL_V1_1_0
build_flags =
    ${env:AKL_V1_1_0.build_flags}
    -DFACTORY_TEST=1

[env:WLG_V1_0_0]
board = WLG_V1_0_0
build_flags =
    ${env.build_flags}

[env:WLG_V1_0_0_Factory_Test]
board = WLG_V1_0_0
build_flags =
    ${env:WLG_V1_0_0.build_flags}
    -DFACTORY_TEST=1